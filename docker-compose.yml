services:
  bot:
    build: .
    container_name: voice_bot
    restart: unless-stopped
    env_file: .env
    environment:
      HEALTH_HOST: 0.0.0.0
      HEALTH_PORT: "8080"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    container_name: voice_bot_nginx
    restart: unless-stopped
    depends_on:
      - bot
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
